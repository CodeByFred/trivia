spring.config.import=optional:file:application-secrets.properties

# MySQL DB config
spring.application.name=Trivia Game Spring Boot App
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/${MYSQL_DB_NAME:trivia}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD}
#${VAR:default} - fallback value if VAR is not set
server.port=8003
server.address=127.0.0.1

# JPA settings
spring.jpa.properties.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true