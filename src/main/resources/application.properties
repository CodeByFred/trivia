spring.config.import=optional:file:application-secrets.properties

# PostgreSQL DB config
spring.application.name=Trivia Game Spring Boot App
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/trivia}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
#${VAR:default} - fallback value if VAR is not set
server.port=8003
server.address=0.0.0.0

# JPA settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true