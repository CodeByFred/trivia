spring.config.import=optional:file:application-secrets.properties

# MySQL DB config
spring.application.name=trivia
spring.datasource.url=jdbc:mysql://localhost:3306/trivia 
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:password}
#${VAR:default} - fallback value if VAR is not set

# JPA settings
spring.jpa.properties.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true